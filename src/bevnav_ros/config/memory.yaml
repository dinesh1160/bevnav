# Persistent BEV map (CLAUDE.md Section 6). The log-odds values are also used by fusion.
/**:
  ros__parameters:
    memory:
      resolution_m: 0.05          # [OURS] map cell
      size_cells: [1000, 1000]    # [OURS] cells along x, along y (50 x 50 m: the 25 m warehouse diagonal from any start)
      origin_m: [-25.0, -25.0]    # [OURS] odom position of the lower-left corner
      l_free: -0.7                # [TUNE] tuned Stage 6: one free observation makes a cell drivable
      l_occ: 0.85                 # [TUNE] Stage 6
      l_min: -2.0                 # [TUNE] Stage 6
      l_max: 3.5                  # [TUNE] Stage 6
      p_free_threshold: 0.65      # [OURS] drivable when P(free) > this (log-odds < -0.62)
      subgoal_m: 3.0              # [TUNE] Stage 6: E5 cost-map goal, this far along the route to /goal
      route_margin_m: 2.0         # [OURS] E5 route search area: known cells, robot and goal plus this
