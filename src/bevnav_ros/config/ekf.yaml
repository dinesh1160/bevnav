# robot_localization EKF (CLAUDE.md Section 5, Stage 2 task 6): publishes odom -> base_footprint
# and /odometry/filtered. Config vectors: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom                      # wheel odometry: forward velocity only. Skid-steer wheels
    odom0_config: [false, false, false,  # slip in turns, so their yaw rate is not fused (Stage 2:
                   false, false, false,  # 7.1 deg yaw error over 20 m with it)
                   true,  false, false,
                   false, false, false,
                   false, false, false]

    imu0: /imu                        # yaw rate only: Gazebo's absolute IMU yaw is exact, so fusing
    imu0_config: [false, false, false,  # it would copy ground truth (CLAUDE.md Section 9)
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
