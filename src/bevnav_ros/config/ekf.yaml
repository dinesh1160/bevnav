# robot_localization EKF (CLAUDE.md Section 5, Stage 2 task 6): publishes odom -> base_footprint
# and /odometry/filtered. Config vectors: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom                      # diff-drive wheel odometry: forward and yaw velocity
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]

    imu0: /imu                        # yaw and yaw rate; relative so odom starts at yaw 0
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
