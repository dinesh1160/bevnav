# Six-heading pan scan (CLAUDE.md Section 6).
/**:
  ros__parameters:
    scan:
      headings: 6                 # [OURS]
      step_rad: 1.0472            # [OURS] 60 deg
      settle_tol_rad: 0.0087      # [OURS] 0.5 deg; bev_node also skips frames with |pan| above this
      settle_time_s: 0.2          # [TUNE] Stage 5
      timeout_s: 15.0             # [OURS] abort a scan that takes longer
